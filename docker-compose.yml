# Sobe MySQL + API + HTTPS automático (Caddy). Rode em um servidor/VPS com IP público e domínio apontado.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: conectabarra
      MYSQL_USER: conecta
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: mysql://conecta:${DB_PASSWORD}@db:3306/conectabarra
      DATABASE_SSL: "false"
      PORT: 3000
      NODE_ENV: production
    stop_grace_period: 15s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?defina API_DOMAIN no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  dbdata:
  caddydata:
